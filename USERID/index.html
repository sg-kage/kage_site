    <style>
        :root {

        body {

        /* 入力欄とボタンを包むコンテナ（位置調整用） */

            position: relative;
            display: flex;
            align-items: center;

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 0.75rem;
            /* 右側にボタン分の余白を確保 */
            padding-right: 3rem; 
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            border-bottom: 2px solid var(--input-border);
            font-size: 1rem;
            box-sizing: border-box;

            letter-spacing: 0.1em;

            border-bottom-color: var(--accent-color);

        /* 覗き見ボタンのデザイン */
        .peek-btn {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 3rem;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            /* 選択不可にする */
            user-select: none; 
            -webkit-user-select: none;
        }

        .peek-btn:hover {
            color: var(--text-main);
        }
        
        .peek-btn:active {
            color: var(--accent-color);
        }

        .result-box {
            background-color: #3a3a3a;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid var(--input-border);
            text-align: center;

            font-size: 1.1rem;

            margin-top: 0.5rem;
            letter-spacing: 0.05em;
        }

        .elapsed-box {
            background-color: #3a3a3a;
            padding: 1rem;
            border-radius: 4px;

            font-size: 0.8rem;

        .char-count {

        .note {

<body>

<div class="container">
    <a class="back-link" href="../">← カゲマス トップ</a>
    <h1>日付確認ツール</h1>

    <div class="input-group">
        <label for="ulidInput">プレイヤーID（先頭10文字・伏字）</label>
        
        <div class="input-wrapper">
            <input type="password" id="ulidInput" placeholder="プレイヤーIDを入力" maxlength="10" autocomplete="off">
            <button type="button" id="peekBtn" class="peek-btn" title="押している間だけ表示">👁️</button>
        </div>

        <div class="char-count" id="statusMsg">10文字入力してください</div>
    </div>

    <div class="input-group">
        <label for="formatOption">表示オプション</label>
        <select id="formatOption">
            <option value="date" selected>日付のみ (年/月/日 曜日)</option>
            <option value="hour">時間まで (年/月/日 曜日 時)</option>
            <option value="minutes">分まで (年/月/日 曜日 時:分)</option>
            <option value="seconds">秒まで (年/月/日 曜日 時:分:秒)</option>
            <option value="full">詳細 (年/月/日 曜日 時:分:秒.ミリ秒)</option>
        </select>
    </div>

    <div class="input-group">
        <label>確認結果</label>
        <div id="result" class="result-box">---</div>
    </div>

    <div class="input-group">
        <label>今日までの経過</label>
        <div id="elapsed" class="elapsed-box">---</div>
        <div id="elapsedSub" class="elapsed-sub"></div>
        <div class="elapsed-note">
            ゲーム内の日付は毎朝4:00に切り替わるため、経過日数も4:00を区切りとして数えています。<br>
            また開始日を「1日目」として数えるため、ゲーム内日数は実際の経過日数より1日多くなります（実経過 99日 → ゲーム内 100日目）。
        </div>
    </div>

    <div class="note">
        <strong>🔒 セキュリティとプライバシー</strong>
        入力内容は伏字で保護され、ブラウザ外には送信されません。<br>
        10文字を超える情報は入力時点でカットされます。
        
        <p>
            <strong>📸 SNSへの投稿について</strong>
            詳細な時刻まで特定されたくない場合は、念のため「日付のみ」にしておくことをおすすめします。
        </p>
    </div>
</div>

<script>
    const ENCODING = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
    const inputEl = document.getElementById('ulidInput');
    const selectEl = document.getElementById('formatOption');
    const resultEl = document.getElementById('result');
    const elapsedEl = document.getElementById('elapsed');
    const elapsedSubEl = document.getElementById('elapsedSub');
    const statusMsg = document.getElementById('statusMsg');
    const peekBtn = document.getElementById('peekBtn');

    // --- メイン処理 ---
    function update() {
        let rawInput = inputEl.value.trim().toUpperCase();
        
        if (rawInput.length > 10) {
            rawInput = rawInput.substring(0, 10);
            inputEl.value = rawInput;
        }

        if (rawInput.length < 10) {
            resultEl.textContent = "---";
            resultEl.style.color = "var(--accent-color)";
            elapsedEl.textContent = "---";
            elapsedSubEl.textContent = "";
            statusMsg.textContent = `残り ${10 - rawInput.length} 文字`;
            statusMsg.style.color = "var(--text-sub)";
            return;
        }

        statusMsg.textContent = "OK: 解析完了";
        statusMsg.style.color = "var(--success-color)";

        try {
            const time = decodeTime(rawInput);
            const date = new Date(time);
            
            if (isNaN(date.getTime())) {
                throw new Error("Invalid Date");
            }

            resultEl.textContent = formatDate(date, selectEl.value);
            resultEl.style.color = "var(--accent-color)";

            const info = formatElapsed(date, selectEl.value);
            if (info) {
                elapsedEl.textContent = `ゲーム内 ${info.gameDay}日目`;
                elapsedSubEl.textContent = `実際の経過 ${info.elapsed}`;
            } else {
                elapsedEl.textContent = "未来の日付";
                elapsedSubEl.textContent = "";
            }
        } catch (e) {
            resultEl.textContent = "無効な形式";
            elapsedEl.textContent = "---";
            elapsedSubEl.textContent = "";
            resultEl.style.color = "var(--error-color)";
            statusMsg.textContent = "不正な文字が含まれています";
            statusMsg.style.color = "var(--error-color)";
        }
    }

    function decodeTime(id) {
        let time = 0;
        for (let i = 0; i < 10; i++) {
            const char = id[i];
            const val = ENCODING.indexOf(char);
            if (val === -1) {
                throw new Error("Invalid Character");
            }
            time = time * 32 + val;
        }
        return time;
    }

    function formatDate(date, format) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        const h = String(date.getHours()).padStart(2, '0');
        const min = String(date.getMinutes()).padStart(2, '0');
        const s = String(date.getSeconds()).padStart(2, '0');
        const ms = String(date.getMilliseconds()).padStart(3, '0');

        // 曜日を取得する処理を追加
        const weekDays = ['(日)', '(月)', '(火)', '(水)', '(木)', '(金)', '(土)'];
        const w = weekDays[date.getDay()];

        switch (format) {
            case 'date': return `${y}/${m}/${d} ${w}`;
            case 'hour': return `${y}/${m}/${d} ${w} ${h}時`;
            case 'minutes': return `${y}/${m}/${d} ${w} ${h}:${min}`;
            case 'seconds': return `${y}/${m}/${d} ${w} ${h}:${min}:${s}`;
            case 'full': default: return `${y}/${m}/${d} ${w} ${h}:${min}:${s}.${ms}`;
        }
    }

    // ゲーム内の日付は朝4:00に切り替わる
    const DAY_RESET_MS = 4 * 3600000;

    function formatElapsed(date, format) {
        const gStart = new Date(date.getTime() - DAY_RESET_MS);
        const now = new Date();
        const gNow = new Date(now.getTime() - DAY_RESET_MS);

        const startDay = new Date(gStart.getFullYear(), gStart.getMonth(), gStart.getDate());
        const today = new Date(gNow.getFullYear(), gNow.getMonth(), gNow.getDate());

        const totalDays = Math.round((today - startDay) / 86400000);
        if (totalDays < 0) return null;

        let years = gNow.getFullYear() - gStart.getFullYear();
        let months = gNow.getMonth() - gStart.getMonth();
        let days = gNow.getDate() - gStart.getDate();
        let restMs = 0;

        if (format !== 'date') {
            restMs = (gNow - today) - (gStart - startDay);
            if (restMs < 0) {
                restMs += 86400000;
                days -= 1;
            }
        }
        if (days < 0) {
            months -= 1;
            // 繰り下げ先は「今日の前月」の日数
            days += new Date(gNow.getFullYear(), gNow.getMonth(), 0).getDate();
        }
        if (months < 0) {
            years -= 1;
            months += 12;
        }

        const h = Math.floor(restMs / 3600000);
        const min = Math.floor(restMs / 60000) % 60;
        const sec = Math.floor(restMs / 1000) % 60;
        const ms = restMs % 1000;

        const parts = [];
        if (years > 0) parts.push(`${years}年`);
        if (months > 0) parts.push(`${months}ヶ月`);
        if (days > 0) parts.push(`${days}日`);

        let tail = '';
        if (format === 'hour') tail = `${h}時間`;
        else if (format === 'minutes') tail = `${h}時間${min}分`;
        else if (format === 'seconds') tail = `${h}時間${min}分${sec}秒`;
        else if (format === 'full') tail = `${h}時間${min}分${sec}.${String(ms).padStart(3, '0')}秒`;

        const ymd = parts.join('');
        let elapsed;
        if (!ymd && !tail) elapsed = "0日";
        // 日付のみの場合だけ暦日数を併記（時刻を含む内訳とは基準が違うため）
        else if (format === 'date') elapsed = (years || months) ? `${ymd} (${totalDays}日)` : ymd;
        else elapsed = [ymd, tail].filter(Boolean).join(' ');

        return { gameDay: totalDays + 1, elapsed: elapsed };
    }

    // --- 覗き見機能 (Hold to view) ---
    const showPassword = () => inputEl.type = 'text';
    const hidePassword = () => inputEl.type = 'password';

    // マウス操作 (PC)
    peekBtn.addEventListener('mousedown', showPassword);
    peekBtn.addEventListener('mouseup', hidePassword);
    peekBtn.addEventListener('mouseleave', hidePassword); // 押したままカーソルが外れた場合も隠す

    // タッチ操作 (スマホ)
    peekBtn.addEventListener('touchstart', (e) => {
        e.preventDefault(); // タッチによる擬似クリックなどを防ぐ
        showPassword();
    });
    peekBtn.addEventListener('touchend', hidePassword);

    // --- 基本イベント ---
    inputEl.addEventListener('input', update);
    selectEl.addEventListener('change', update);
    inputEl.addEventListener('paste', () => { setTimeout(update, 1); });

</script>

</body>
