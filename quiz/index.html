<!DOCTYPE html>
<html lang="ja">
<head>

  <meta property="og:site_name" content="カゲマス攻略ツール集">

  <meta property="og:description" content="奥義・特技・特殊・魔道具の効果文から持ち主のキャラを、状態効果の説明から名称を当てるクイズ。">

  <meta property="og:image:width" content="1200">

  <meta name="twitter:title" content="カゲマス スキル効果クイズ｜効果文からキャラや状態効果を当てよう">
  <meta name="twitter:description" content="奥義・特技・特殊・魔道具の効果文から持ち主のキャラを、状態効果の説明から名称を当てるクイズ。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050505;
      --panel: rgba(16, 16, 16, 0.72);
      --green: #10b981;
      --green-bright: #34d399;
      --green-deep: #064e3b;
      --green-glow: rgba(16, 185, 129, 0.35);
      --red: #f87171;
      --red-dim: rgba(248, 113, 113, 0.14);
      --text: #e2e8f0;
      --text-sub: #94a3b8;
      --text-dim: #475569;
      --gold: #f5d77a;
      --gold-dim: rgba(245, 215, 122, 0.14);
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Noto Sans JP', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(6, 78, 59, 0.85) 0%, rgba(0, 0, 0, 0) 60%),
        repeating-linear-gradient(0deg, rgba(16, 185, 129, 0.025) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(90deg, rgba(16, 185, 129, 0.025) 0 1px, transparent 1px 44px);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =============== ヘッダー =============== */
    .dashboard-header {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 14px 16px 12px;
      background: rgba(5, 5, 5, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(16, 185, 129, 0.3);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .header-inner { width: 100%; max-width: 48rem; }

    .back-link {
      display: inline-block;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .back-link:hover { color: #00f2ff; }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(95deg, #a7f3d0 0%, var(--green-bright) 55%, #5eead4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.45));
      white-space: nowrap;
    }
    .subtitle {
      font-size: 0.72rem;
      color: var(--text-sub);
      letter-spacing: 0.03em;
    }

    /* =============== 本体 =============== */
    main {
      width: 100%;
      max-width: 48rem;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
    }

    .settings h2, .result h2 {
      font-size: 0.8rem;
      color: var(--green-bright);
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .settings h2:not(:first-child) { margin-top: 14px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font: inherit;
      font-size: 0.82rem;
      color: var(--text-sub);
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip[aria-pressed="true"] {
      color: #f0fdf4;
      background: rgba(6, 78, 59, 0.6);
      border-color: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
    }

    .pool-info {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 12px;
    }

    .btn-primary {
      font: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      color: #022c22;
      background: linear-gradient(95deg, #6ee7b7, var(--green-bright));
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
      box-shadow: 0 0 18px var(--green-glow);
    }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

    /* =============== 出題 =============== */
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-bottom: 10px;
    }
    .q-kind {
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gold);
      background: var(--gold-dim);
      border-radius: 6px;
      padding: 2px 8px;
    }
    .q-text {
      white-space: pre-line;
      font-size: 0.95rem;
      line-height: 1.8;
      padding: 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      word-break: break-word;
    }
    .q-prompt {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin: 14px 0 8px;
    }

    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice {
      font: inherit;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      color: var(--text);
      background: rgba(20, 20, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    /* タッチ端末ではタップ後も :hover が残り、正解表示の緑と紛らわしいのでマウス操作時だけにする */
    @media (hover: hover) {
      .choice:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.35); }
    }
    .choice:disabled { cursor: default; }
    .choice img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
    }
    .choice img.status-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      background: none;
    }
    .choice .c-name { font-size: 0.85rem; font-weight: 700; line-height: 1.3; }
    .choice .c-title { display: block; font-size: 0.7rem; font-weight: 400; color: var(--text-sub); }
    .choice.selected { border-color: var(--gold); background: var(--gold-dim); box-shadow: 0 0 10px rgba(245, 215, 122, 0.25); }
    .choice.correct { border-color: var(--green-bright); background: rgba(6, 78, 59, 0.6); }
    .choice.wrong { border-color: var(--red); background: var(--red-dim); }
    .choice.dim { opacity: 0.45; }

    .feedback {
      margin-top: 14px;
      font-size: 0.85rem;
      line-height: 1.7;
    }
    .feedback .verdict { font-weight: 900; font-size: 1rem; }
    .feedback .verdict.ok { color: var(--green-bright); }
    .feedback .verdict.ng { color: var(--red); }
    .feedback a { color: var(--green-bright); }

    /* =============== 結果 =============== */
    .result { text-align: center; }

    .result-card {
      max-width: 30rem;
      margin: 0 auto;
      padding: 18px 18px 14px;
      border-radius: 16px;
      border: 1px solid rgba(52, 211, 153, 0.55);
      background:
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.35) 0%, rgba(0, 0, 0, 0) 65%),
        repeating-linear-gradient(0deg, rgba(16, 185, 129, 0.05) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(90deg, rgba(16, 185, 129, 0.05) 0 1px, transparent 1px 28px),
        #07120e;
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.25), inset 0 0 24px rgba(0, 0, 0, 0.6);
    }
    .rc-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 0.72rem;
      margin-bottom: 14px;
    }
    .rc-brand {
      font-weight: 900;
      letter-spacing: 0.06em;
      background: linear-gradient(95deg, #a7f3d0 0%, var(--green-bright) 55%, #5eead4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .rc-date { font-family: var(--mono); color: var(--text-sub); }
    .rc-rank-label { font-size: 0.68rem; color: var(--text-sub); letter-spacing: 0.3em; }
    .rc-rank {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-shadow: 0 0 16px rgba(245, 215, 122, 0.45);
      margin-bottom: 4px;
    }
    .score-big {
      font-family: var(--mono);
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--green-bright);
      text-shadow: 0 0 18px var(--green-glow);
    }
    .score-big .score-total { font-size: 1.4rem; color: var(--text-sub); text-shadow: none; }
    .rc-rate { font-family: var(--mono); font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
    .score-comment { color: var(--text); font-size: 0.85rem; margin-top: 8px; }

    .rc-settings {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      text-align: left;
      margin: 14px 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.78rem;
    }
    .rc-settings dt { color: var(--green-bright); font-weight: 700; white-space: nowrap; }
    .rc-settings dd { display: flex; flex-wrap: wrap; gap: 4px; }
    .rc-tag {
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(6, 78, 59, 0.6);
      border: 1px solid rgba(52, 211, 153, 0.4);
      font-size: 0.72rem;
      line-height: 1.6;
    }
    .rc-foot {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 8px;
      font-size: 0.64rem;
      color: var(--text-sub);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }
    .rc-foot span:first-child { font-family: var(--mono); }

    .btn-share {
      color: #fff;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: none;
    }
    .btn-share:disabled { opacity: 0.6; cursor: wait; }
    .btn-text {
      font: inherit;
      font-size: 0.8rem;
      color: var(--text-sub);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 8px;
    }
    .copy-status { font-size: 0.78rem; color: var(--green-bright); min-height: 1.2em; margin-top: 4px; }
    .copy-status.ng { color: var(--red); }
    .review-title {
      font-size: 0.8rem;
      color: var(--green-bright);
      letter-spacing: 0.05em;
      text-align: left;
      margin-top: 22px;
    }
    .review { text-align: left; margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }

    .disclaimer {
      font-size: 0.68rem;
      line-height: 1.7;
      color: var(--text-dim);
      text-align: center;
      padding: 4px 0 20px;
    }
    .review-item {
      font-size: 0.78rem;
      line-height: 1.6;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.35);
      border-left: 3px solid var(--green);
    }
    .review-item.ng { border-left-color: var(--red); }
    .review-item .r-head { font-weight: 700; }
    .review-item .r-sub { color: var(--text-sub); white-space: pre-line; }

    .hidden { display: none !important; }

    @media (max-width: 520px) {
      .choices { grid-template-columns: 1fr; }
      .q-text { font-size: 0.88rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

  <header class="dashboard-header">
    <div class="header-inner">
      <a class="back-link" href="../">← カゲマス トップ</a>
      <div class="title-row">
        <h1>スキル効果クイズ</h1>
        <p class="subtitle">効果文からキャラや状態効果を当てよう</p>
      </div>
    </div>
  </header>

  <main>
    <section class="panel settings" id="settings">
      <h2>出題範囲</h2>
      <div class="chips" id="kindChips"></div>
      <h2>問題数</h2>

      <p class="pool-info" id="poolInfo">データを読み込み中…</p>
      <button class="btn-primary" id="startBtn" disabled>スタート</button>
    </section>

    <section class="panel hidden" id="quiz">
      <div class="q-meta">
        <span id="qProgress"></span>
        <span class="q-kind" id="qKind"></span>

      </div>
      <div class="q-text" id="qText"></div>
      <p class="q-prompt" id="qPrompt"></p>
      <div class="choices" id="choices"></div>
      <div class="feedback hidden" id="feedback"></div>
      <button class="btn-primary" id="confirmBtn" disabled>確定</button>
      <button class="btn-primary hidden" id="nextBtn">次の問題へ</button>
    </section>

    <section class="panel result hidden" id="result">
      <div class="result-card" id="resultCard">
        <div class="rc-head">
          <span class="rc-brand">カゲマス スキル効果クイズ</span>
          <span class="rc-date" id="rcDate"></span>
        </div>
        <div class="rc-rank-label">称号</div>
        <div class="rc-rank" id="rcRank"></div>
        <div class="score-big" id="scoreBig"></div>
        <div class="rc-rate" id="rcRate"></div>
        <p class="score-comment" id="scoreComment"></p>
        <dl class="rc-settings" id="rcSettings"></dl>
        <div class="rc-foot">
          <span>sg-kage.github.io/kage_site/quiz/</span>
          <span>※ファン制作の非公式ツールです</span>
        </div>
      </div>
      <button class="btn-primary btn-share" id="copyImageBtn">結果を画像でコピー</button>
      <button class="btn-text" id="copyTextBtn">テキストだけコピー</button>
      <p class="copy-status" id="copyStatus" aria-live="polite"></p>
      <button class="btn-primary" id="retryBtn">もう一度（同じ設定）</button>
      <button class="btn-primary" id="backBtn" style="background: rgba(20,20,20,0.8); color: var(--text); box-shadow: none; border: 1px solid rgba(255,255,255,0.15);">設定に戻る</button>
      <h2 class="review-title">振り返り</h2>
      <div class="review" id="review"></div>
    </section>

    <p class="disclaimer">
      ※本ページはファンが制作した非公式ツールです。ゲーム公式とは一切関係ありません。<br>
      状態効果の説明は公式サイトのヘルプ「状態異常・特殊効果」から引用しています。
    </p>
  </main>

  <script src="https://sg-kage.github.io/kage_character/js/kage-data.js"></script>
  <script>
  (() => {
    'use strict';

    const CONFIG = {
      charsUrl: 'https://sg-kage.github.io/kage_character/characters/all_characters_ja.bin',
      imgDir: 'https://sg-kage.github.io/kage_character/image/characters/',
      zukanUrl: 'https://sg-kage.github.io/kage_character/',   // ?pos=Pos値 でキャラ詳細を直接開ける
      statusHelpUrl: 'https://www.shadow-garden-mog.jp/help/battlesystem0/battlesystem10/?cat=battle',
      statusUrl: './status_effects.json',   // build_status_effects.py が公式ヘルプから生成する
      ext: '.webp',
      kinds: [
        { id: 'ultimate', label: '奥義', fields: ['ultimate', 'ex_ultimate'] },
        { id: 'skill', label: '特技', fields: ['skill1', 'skill2'] },
        { id: 'traits', label: '特殊', fields: ['traits'] },
        { id: 'magic', label: '魔道具', fields: ['magic_item1', 'magic_item2'] },
        { id: 'combo', label: 'コンボ', fields: ['combo'] },
        { id: 'status', label: '状態効果', fields: [] }
      ],
      defaultOff: ['combo'],
      fieldLabels: {
        ultimate: '奥義', ex_ultimate: '究極奥義', skill1: '特技1', skill2: '特技2',
        traits: '特殊', magic_item1: '魔道具1', magic_item2: '魔道具2', combo: 'コンボ'
      },
      counts: [5, 10, 20],
      levels: [
        { id: 'easy', label: 'ふつう（ランダム）', short: 'ふつう' },
        { id: 'hard', label: 'むずかしい（似たものを優先）', short: 'むずかしい' }
      ],
      choiceCounts: [4, 6, 8],
      quizUrl: 'https://sg-kage.github.io/kage_site/quiz/',
      html2canvasSrc: 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
      html2canvasSri: 'sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H',
      SETTINGS_KEY: 'kage_quiz_settings'
    };

    const state = {
      chars: [],
      pool: [],            // { kind, key, ...種類ごとのデータ }
      kinds: new Set(CONFIG.kinds.filter(k => !CONFIG.defaultOff.includes(k.id)).map(k => k.id)),
      count: 10,
      choiceCount: 4,
      level: 'easy',
      questions: [],
      index: 0,
      selected: null,      // 確定前に選んでいる選択肢の index
      played: null,        // スタート時点の設定。結果画面に出すので、途中で設定を変えても残す
      shareText: '',
      score: 0,
      answers: []
    };

    const $ = id => document.getElementById(id);

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function splitName(name) {
      const m = name.match(/^(.+?)[\[［](.+)[\]］]$/);
      return m ? { short: m[1], title: m[2] } : { short: name, title: '' };
    }

    function imgUrl(char) {
      return `${CONFIG.imgDir}${encodeURIComponent(char.name)}${CONFIG.ext}`;
    }

    // {min, max} は Lv により変わる値。クイズでは最小値だけ見せる
    function formatEffect(text) {
      return text.replace(/\{([\d.]+),\s*([\d.]+)\}/g, '$1');
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 優先度の高い候補群から順に need 件まで埋める
    function fillFromTiers(tiers, need) {
      const picked = [];
      for (const tier of tiers) {
        for (const x of shuffle(tier)) {
          if (picked.length >= need) return picked;
          picked.push(x);
        }
      }
      return picked;
    }

    // 同じ文を複数の正解候補が持つと正解が一意に決まらないので、一意な文だけを残す
    function uniqueByText(entries, ownerOf) {
      const owners = new Map();
      for (const e of entries) {
        if (!owners.has(e.text)) owners.set(e.text, new Set());
        owners.get(e.text).add(ownerOf(e));
      }
      return entries.filter(e => owners.get(e.text).size === 1);
    }

    function buildCharPool(chars) {
      const entries = [];
      for (const char of chars) {
        for (const kind of CONFIG.kinds) {
          for (const field of kind.fields) {
            const v = char[field];
            const items = typeof v === 'string' ? [{ title: '', normal: v }] : (Array.isArray(v) ? v : []);
            for (const e of items) {
              const t = (e?.normal || '').trim();
              if (t) entries.push({ kind: kind.id, key: `c${char.position}`, char, field, title: e.title || '', text: t });
            }
          }
        }
      }
      return uniqueByText(entries, e => e.char.position);
    }

    // 除外・伏せ字・重複除去は build_status_effects.py で済ませてある
    function buildStatusPool(effects) {
      return effects.map(e => ({ kind: 'status', key: `s${e.name}`, name: e.name, type: e.type, icon: e.icon, text: e.desc }));
    }

    function activePool() {
      return state.pool.filter(e => state.kinds.has(e.kind));
    }

    // =============== 問題の組み立て ===============
    function charChoice(c) {
      const { short, title } = splitName(c.name);
      return { key: `c${c.position}`, label: short, sub: title ? `[${title}]` : '', img: imgUrl(c) };
    }

    function makeCharQuestion(e) {
      const answer = e.char;
      const others = state.chars.filter(c => c.position !== answer.position);
      const need = state.choiceCount - 1;
      const distractors = state.level === 'easy'
        ? shuffle(others).slice(0, need)
        : fillFromTiers([
            others.filter(c => c.role === answer.role && c.attribute === answer.attribute),
            others.filter(c => c.role === answer.role && c.attribute !== answer.attribute),
            others.filter(c => c.role !== answer.role)
          ], need);
      const partName = CONFIG.fieldLabels[e.field] + (e.title ? `「${e.title}」` : '');
      return {
        tag: CONFIG.fieldLabels[e.field],
        text: formatEffect(e.text),
        prompt: 'この効果を持つキャラは？',
        answerKey: e.key,
        choices: shuffle([answer, ...distractors]).map(charChoice),
        answerLabel: answer.name,
        explain: `${answer.name} の${partName}`,
        link: { href: `${CONFIG.zukanUrl}?pos=${answer.position}`, label: '図鑑で見る →' }
      };
    }

    function makeStatusQuestion(e) {
      const statusPool = state.pool.filter(x => x.kind === 'status' && x.key !== e.key);
      const need = state.choiceCount - 1;
      const distractors = state.level === 'easy'
        ? shuffle(statusPool).slice(0, need)
        : fillFromTiers([statusPool.filter(x => x.type === e.type), statusPool.filter(x => x.type !== e.type)], need);
      return {
        tag: '状態効果',
        text: e.text,
        prompt: 'この効果の名称は？',
        answerKey: e.key,
        choices: shuffle([e, ...distractors]).map(x => ({ key: x.key, label: x.name, sub: '', img: x.icon, icon: true })),
        answerLabel: e.name,
        explain: `${e.name}（${e.type}）`,
        link: { href: CONFIG.statusHelpUrl, label: '公式ヘルプで見る →' }
      };
    }

    function generateQuestions() {
      // 件数の少ない種類（状態効果など）も出るよう、まず種類を均等に選んでから問題を選ぶ。
      // 同じキャラ・同じ効果ばかり出ないよう、正解単位で重複も避ける
      const byKind = new Map();
      for (const e of shuffle(activePool())) {
        if (!byKind.has(e.kind)) byKind.set(e.kind, []);
        byKind.get(e.kind).push(e);
      }
      const used = new Set();
      const qs = [];
      while (qs.length < state.count && byKind.size) {
        const kinds = [...byKind.keys()];
        const kind = kinds[Math.floor(Math.random() * kinds.length)];
        const list = byKind.get(kind);
        const e = list.pop();
        if (!list.length) byKind.delete(kind);
        if (used.has(e.key)) continue;
        used.add(e.key);
        qs.push(e.kind === 'status' ? makeStatusQuestion(e) : makeCharQuestion(e));
      }
      return qs;
    }

    // =============== 設定UI ===============
    function renderChips(containerId, items, isOn, onToggle) {
      const box = $(containerId);
      box.innerHTML = '';
      for (const item of items) {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.type = 'button';
        btn.textContent = item.label;
        btn.setAttribute('aria-pressed', String(isOn(item)));
        btn.addEventListener('click', () => { onToggle(item); renderSettings(); });
        box.appendChild(btn);
      }
    }

    function renderSettings() {
      renderChips('kindChips', CONFIG.kinds, k => state.kinds.has(k.id), k => {
        if (state.kinds.has(k.id)) state.kinds.delete(k.id); else state.kinds.add(k.id);
      });
      renderChips('countChips', CONFIG.counts.map(n => ({ id: n, label: `${n}問` })),
        c => c.id === state.count, c => { state.count = c.id; });
      renderChips('choiceChips', CONFIG.choiceCounts.map(n => ({ id: n, label: `${n}択` })),
        c => c.id === state.choiceCount, c => { state.choiceCount = c.id; });
      renderChips('levelChips', CONFIG.levels, l => l.id === state.level, l => { state.level = l.id; });

      if (!state.chars.length) return;
      const n = activePool().length;
      $('poolInfo').textContent = `出題候補 ${n} 件`;
      $('startBtn').disabled = n === 0;
      saveSettings();
    }

    function saveSettings() {
      try {
        localStorage.setItem(CONFIG.SETTINGS_KEY, JSON.stringify({
          kinds: [...state.kinds], count: state.count, choiceCount: state.choiceCount, level: state.level
        }));
      } catch (_) { /* 保存できなくても動作に支障なし */ }
    }

    function loadSettings() {
      try {
        const s = JSON.parse(localStorage.getItem(CONFIG.SETTINGS_KEY) || 'null');
        if (!s) return;
        const validKinds = (s.kinds || []).filter(id => CONFIG.kinds.some(k => k.id === id));
        if (validKinds.length) state.kinds = new Set(validKinds);
        if (CONFIG.counts.includes(s.count)) state.count = s.count;
        if (CONFIG.choiceCounts.includes(s.choiceCount)) state.choiceCount = s.choiceCount;
        if (CONFIG.levels.some(l => l.id === s.level)) state.level = s.level;
      } catch (_) { /* 壊れた保存値は無視 */ }
    }

    // =============== 出題 ===============
    function show(sectionId) {
      for (const id of ['settings', 'quiz', 'result']) $(id).classList.toggle('hidden', id !== sectionId);
      window.scrollTo({ top: 0 });
    }

    function startQuiz() {
      state.questions = generateQuestions();
      state.played = {
        kinds: CONFIG.kinds.filter(k => state.kinds.has(k.id)).map(k => k.label),
        count: state.questions.length,
        choiceCount: state.choiceCount,
        level: CONFIG.levels.find(l => l.id === state.level).short
      };
      state.index = 0;
      state.score = 0;
      state.answers = [];
      show('quiz');
      renderQuestion();
    }

    function renderQuestion() {
      const q = state.questions[state.index];
      $('qProgress').textContent = `Q${state.index + 1} / ${state.questions.length}`;
      $('qScore').textContent = `${state.score} 正解`;
      $('qKind').textContent = q.tag;
      $('qText').textContent = q.text;
      $('qPrompt').textContent = q.prompt;
      $('feedback').classList.add('hidden');
      $('nextBtn').classList.add('hidden');
      $('confirmBtn').classList.remove('hidden');
      $('confirmBtn').disabled = true;
      state.selected = null;

      const box = $('choices');
      box.innerHTML = '';
      q.choices.forEach((c, i) => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.type = 'button';
        btn.dataset.idx = i;
        btn.innerHTML = `
          ${c.img ? `<img${c.icon ? ' class="status-icon"' : ''} src="${c.img}" alt="" loading="lazy" onerror="this.onerror=null;this.style.visibility='hidden'">` : ''}
          <span class="c-name">${escapeHtml(c.label)}${c.sub ? `<span class="c-title">${escapeHtml(c.sub)}</span>` : ''}</span>`;
        btn.addEventListener('click', () => select(i));
        box.appendChild(btn);
      });
    }

    function select(idx) {
      state.selected = idx;
      for (const btn of $('choices').children) btn.classList.toggle('selected', Number(btn.dataset.idx) === idx);
      $('confirmBtn').disabled = false;
    }

    function answer() {
      if (state.selected === null) return;
      const q = state.questions[state.index];
      const chosen = q.choices[state.selected];
      $('confirmBtn').classList.add('hidden');
      const ok = chosen.key === q.answerKey;
      if (ok) state.score++;
      state.answers.push({ q, chosen, ok });

      for (const btn of $('choices').children) {
        const c = q.choices[Number(btn.dataset.idx)];
        btn.disabled = true;
        btn.classList.remove('selected');
        if (c.key === q.answerKey) btn.classList.add('correct');
        else if (c === chosen) btn.classList.add('wrong');
        else btn.classList.add('dim');
      }

      const fb = $('feedback');
      fb.innerHTML = `
        <div class="verdict ${ok ? 'ok' : 'ng'}">${ok ? '正解！' : '不正解…'}</div>
        <div>${escapeHtml(q.explain)}</div>
        <div><a href="${q.link.href}" target="_blank" rel="noopener">${escapeHtml(q.link.label)}</a></div>`;
      fb.classList.remove('hidden');
      $('qScore').textContent = `${state.score} 正解`;

      const last = state.index === state.questions.length - 1;
      $('nextBtn').textContent = last ? '結果を見る' : '次の問題へ';
      $('nextBtn').classList.remove('hidden');
      $('nextBtn').focus({ preventScroll: true });
    }

    function next() {
      if (state.index < state.questions.length - 1) {
        state.index++;
        renderQuestion();
        window.scrollTo({ top: 0 });
      } else {
        renderResult();
      }
    }

    function rankOf(rate) {
      if (rate === 1) return { title: '陰の実力者', comment: '全問正解！完璧です' };
      if (rate >= 0.8) return { title: '七陰', comment: 'かなりの知識量です' };
      if (rate >= 0.5) return { title: 'シャドウガーデン', comment: 'なかなかの腕前です' };
      return { title: 'モブ', comment: 'まだまだ修行が必要です' };
    }

    function renderResult() {
      const total = state.questions.length;
      const rate = state.score / total;
      const rank = rankOf(rate);
      const p = state.played;
      const now = new Date();
      $('rcDate').textContent = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')}`;
      $('rcRank').textContent = rank.title;
      $('scoreBig').innerHTML = `${state.score}<span class="score-total"> / ${total}</span>`;
      $('rcRate').textContent = `正答率 ${Math.round(rate * 100)}%`;
      $('scoreComment').textContent = rank.comment;
      const tags = list => list.map(t => `<span class="rc-tag">${escapeHtml(t)}</span>`).join('');
      $('rcSettings').innerHTML = `
        <dt>出題範囲</dt><dd>${tags(p.kinds)}</dd>
        <dt>問題数</dt><dd>${tags([`${p.count}問`])}</dd>
        <dt>選択肢</dt><dd>${tags([`${p.choiceCount}択`])}</dd>
        <dt>難易度</dt><dd>${tags([p.level])}</dd>`;

      state.shareText = [
        `カゲマス スキル効果クイズで ${state.score}/${total} 問正解！`,
        `称号：${rank.title}`,
        `（${p.kinds.join('・')}／${p.choiceCount}択／${p.level}）`,
        '#カゲマス',
        CONFIG.quizUrl
      ].join('\n');
      setCopyStatus('');

      $('review').innerHTML = state.answers.map(({ q, chosen, ok }) => `
        <div class="review-item ${ok ? '' : 'ng'}">
          <div class="r-head">${ok ? '○' : '×'} ${escapeHtml(q.explain)}</div>
          ${ok ? '' : `<div class="r-sub">あなたの回答：${escapeHtml(chosen.label + (chosen.sub || ''))}</div>`}
          <div class="r-sub">${escapeHtml(q.text)}</div>
        </div>`).join('');
      show('result');
    }

    // =============== 結果のコピー ===============
    let html2canvasPromise = null;
    function loadHtml2Canvas() {
      if (window.html2canvas) return Promise.resolve();
      if (!html2canvasPromise) {
        html2canvasPromise = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = CONFIG.html2canvasSrc;
          s.integrity = CONFIG.html2canvasSri;
          s.crossOrigin = 'anonymous';
          s.onload = () => resolve();
          s.onerror = () => {
            html2canvasPromise = null;  // 次回押下で再試行できるようにする
            s.remove();
            reject(new Error('html2canvas load failed'));
          };
          document.head.appendChild(s);
        });
      }
      return html2canvasPromise;
    }

    async function renderCardPng() {
      await loadHtml2Canvas();
      const card = $('resultCard');
      const canvas = await window.html2canvas(card, {
        backgroundColor: '#050505',
        scale: 2,
        scrollX: -window.scrollX,
        scrollY: -window.scrollY,
        onclone: doc => {
          const style = doc.createElement('style');
          // html2canvas は background-clip:text 非対応で文字が四角く塗られる。
          // 重ねた radial/repeating グラデーションと inset の影も崩れるので単純なグラデーションに置き換える。
          // webfont のロード差で行高がずれるのを防ぐためシステムフォントに固定する
          style.textContent = `
            #resultCard {
              background: linear-gradient(180deg, #0d3326 0%, #07120e 55%, #050b09 100%) !important;
              box-shadow: none !important;
            }
            #resultCard, #resultCard * {
              animation: none !important;
              transition: none !important;
              font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif !important;
            }
            #resultCard .rc-brand {
              background: none !important;
              -webkit-text-fill-color: #6ee7b7 !important;
              color: #6ee7b7 !important;
            }`;
          doc.head.appendChild(style);
        }
      });
      return new Promise((resolve, reject) =>
        canvas.toBlob(b => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png'));
    }

    function setCopyStatus(msg, ng = false) {
      $('copyStatus').textContent = msg;
      $('copyStatus').classList.toggle('ng', ng);
    }

    function downloadBlob(blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'kagemasu-quiz-result.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    async function copyImage() {
      const btn = $('copyImageBtn');
      btn.disabled = true;
      setCopyStatus('画像を作成中…');
      // Safari はクリック直後に clipboard.write を呼ばないと拒否するため、画像は Promise のまま渡す
      const pngPromise = renderCardPng();
      const textBlob = new Blob([state.shareText], { type: 'text/plain' });
      try {
        if (!window.ClipboardItem || !navigator.clipboard?.write) throw new Error('clipboard image unsupported');
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngPromise, 'text/plain': textBlob })]);
          setCopyStatus('画像とテキストをコピーしました。SNSの投稿欄に貼り付けてください');
        } catch (e) {
          // 複数形式の同時書き込みに対応していないブラウザ向け
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngPromise })]);
          setCopyStatus('画像をコピーしました。テキストは「テキストだけコピー」から');
        }
      } catch (e) {
        console.warn(e);
        try {
          downloadBlob(await pngPromise);
          setCopyStatus('このブラウザは画像のコピーに未対応のため、画像を保存しました');
        } catch (e2) {
          console.error(e2);
          setCopyStatus('画像の作成に失敗しました。スクリーンショットをご利用ください', true);
        }
      } finally {
        btn.disabled = false;
      }
    }

    async function copyText() {
      try {
        await navigator.clipboard.writeText(state.shareText);
        setCopyStatus('テキストをコピーしました');
      } catch (e) {
        console.error(e);
        setCopyStatus('コピーに失敗しました', true);
      }
    }

    // =============== 初期化 ===============
    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      renderSettings();

      $('startBtn').addEventListener('click', startQuiz);
      $('confirmBtn').addEventListener('click', answer);
      $('copyImageBtn').addEventListener('click', copyImage);
      $('copyTextBtn').addEventListener('click', copyText);
      $('nextBtn').addEventListener('click', next);
      $('retryBtn').addEventListener('click', startQuiz);
      $('backBtn').addEventListener('click', () => show('settings'));

      Promise.all([
        KageData.load(CONFIG.charsUrl),
        fetch(CONFIG.statusUrl, { cache: 'no-cache' }).then(r => r.json())
      ]).then(([chars, statusEffects]) => {
        state.chars = chars;
        state.pool = [...buildCharPool(chars), ...buildStatusPool(statusEffects)];
        renderSettings();
      }).catch(err => {
        console.error(err);
        $('poolInfo').textContent = 'データの読み込みに失敗しました。時間をおいて再読み込みしてください。';
      });
    });
  })();
  </script>
</body>
